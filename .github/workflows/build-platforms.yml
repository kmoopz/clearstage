name: Build macOS and Linux packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Package Linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          if ! npx electron-builder --linux AppImage --x64 --publish never; then
            echo "AppImage build failed; falling back to tar.gz"
            npx electron-builder --linux tar.gz --x64 --publish never
          fi
          ARTIFACT=$(find release -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.tar.gz' \) | head -n1)
          test -n "$ARTIFACT"
          if [[ "$ARTIFACT" == *.AppImage ]]; then
            cp "$ARTIFACT" "$GITHUB_WORKSPACE/artifacts/ClearStage-0.1.0-linux-x64.AppImage"
            chmod +x "$GITHUB_WORKSPACE/artifacts/ClearStage-0.1.0-linux-x64.AppImage"
          else
            cp "$ARTIFACT" "$GITHUB_WORKSPACE/artifacts/ClearStage-0.1.0-linux-x64.tar.gz"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Package and ad-hoc sign
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for ARCH in x64 arm64; do
            npx electron-builder --mac dir --$ARCH --publish never
            if [ "$ARCH" = "x64" ]; then APPDIR=release/mac; else APPDIR=release/mac-arm64; fi
            APP=$(find "$APPDIR" -maxdepth 1 -type d -name '*.app' | head -n1)
            test -n "$APP"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/artifacts/ClearStage-0.1.0-mac-$ARCH.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Attach packages to release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh artifacts
          gh release upload v0.1.0 artifacts/* --clobber
