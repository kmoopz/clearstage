<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: #07100d; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 62% 26%, rgba(126, 240, 194, .28), transparent 42%),
      radial-gradient(circle at 20% 84%, rgba(255, 201, 120, .08), transparent 40%),
      linear-gradient(145deg, #0a1713, #060b09 65%);
  }
  .frame { width: 760px; height: 760px; display: grid; place-items: center; position: relative; }
  .frame::before { content: ""; position: absolute; inset: 0; border: 2px solid rgba(126,240,194,.13); border-radius: 220px; }
  img { width: 640px; height: 640px; }
</style>
</head>
<body>
  <div class="frame"><img src="../site/assets/logo.svg" alt="" /></div>
</body>
</html>
